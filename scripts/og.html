<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Fuentes locales (subconjunto latino) para que el script funcione
         sin conexión y el render sea siempre idéntico. */
      @font-face {
        font-family: "Outfit";
        font-weight: 800;
        font-style: normal;
        src: url("fuentes/outfit-800.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        font-style: normal;
        src: url("fuentes/inter-variable.woff2") format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Inter", system-ui, sans-serif;
        background: linear-gradient(160deg, #0a0406 0%, #3a0d1c 38%, #8e1533 66%, #d52b58 100%);
        color: #fbf4eb;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 76px;
      }

      /* El sol queda fuera de la columna de texto para no restarle contraste. */
      .sol {
        position: absolute;
        right: -40px;
        bottom: -40px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: #ec96a8;
        box-shadow: 0 0 150px 80px rgba(236, 150, 168, 0.4);
      }

      .marca {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 34px;
        position: relative;
      }
      .marca img { height: 150px; width: auto; }

      h1 {
        font-family: "Outfit", sans-serif;
        font-weight: 800;
        font-size: 76px;
        line-height: 1.04;
        letter-spacing: -0.03em;
        max-width: 15ch;
        position: relative;
      }
      h1 em { font-style: normal; color: #ec96a8; }

      p {
        margin-top: 26px;
        max-width: 820px;
        font-size: 29px;
        font-weight: 400;
        color: rgba(251, 244, 235, 0.92);
        position: relative;
      }

      .sellos {
        margin-top: 44px;
        display: flex;
        gap: 14px;
        position: relative;
      }
      .sellos b {
        font-size: 23px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 999px;
        background: rgba(251, 244, 235, 0.14);
        border: 2px solid rgba(251, 244, 235, 0.28);
      }
    </style>
  </head>
