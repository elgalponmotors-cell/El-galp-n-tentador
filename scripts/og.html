<!doctype html>
<!--
  Plantilla de la imagen para compartir en redes (Open Graph).
  Se convierte a public/og.png con:  node scripts/generar-og.mjs
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Fuentes locales (subconjunto latino) para que el script funcione
         sin conexión y el render sea siempre idéntico. */
      @font-face {
        font-family: "Outfit";
        font-weight: 800;
        font-style: normal;
        src: url("fuentes/outfit-800.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        font-style: normal;
        src: url("fuentes/inter-variable.woff2") format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Inter", system-ui, sans-serif;
        background: linear-gradient(170deg, #0b3b4a 0%, #1c6b7a 46%, #ff8a6b 78%, #ffc24b 100%);
        color: #fff9f2;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 76px;
      }

      /* El sol queda fuera de la columna de texto para no restarle contraste. */
      .sol {
        position: absolute;
        right: -40px;
        bottom: -40px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: #fff0c4;
        box-shadow: 0 0 140px 70px rgba(255, 217, 138, 0.45);
      }

      .marca {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 34px;
        position: relative;
      }
      .marca svg { width: 62px; height: 62px; }
      .marca span {
        font-family: "Outfit", sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.02em;
      }

      h1 {
        font-family: "Outfit", sans-serif;
        font-weight: 800;
        font-size: 76px;
        line-height: 1.04;
        letter-spacing: -0.03em;
        max-width: 15ch;
        position: relative;
      }
      h1 em { font-style: normal; color: #ffc24b; }

      p {
        margin-top: 26px;
        max-width: 820px;
        font-size: 29px;
        font-weight: 400;
        color: rgba(255, 249, 242, 0.92);
        position: relative;
      }

      .sellos {
        margin-top: 44px;
        display: flex;
        gap: 14px;
        position: relative;
      }
      .sellos b {
        font-size: 23px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 999px;
        background: rgba(255, 249, 242, 0.16);
        border: 2px solid rgba(255, 249, 242, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="sol"></div>

    <div class="marca">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#fff9f2" />
        <path d="M10 44v-6c0-3 2-5 5-6l12-2 8-8c2-2 4-3 6-3h9c3 0 5 1 7 3l7 8v10c0 2-1 3-3 3H13c-2 0-3-1-3-3Z" fill="#0fb5ae" />
        <path d="M30 30V21h5v9Zm9 0v-9h5c1 0 2 0 3 1l6 8Z" fill="#0b3b4a" />
        <circle cx="22" cy="46" r="6" fill="#0b3b4a" />
        <circle cx="46" cy="46" r="6" fill="#0b3b4a" />
      </svg>
      <span>El Galpón Rent a Car</span>
    </div>

    <h1>Alquilá tu auto en <em>Miami</em> y <em>Fort Lauderdale</em></h1>
    <p>Retiro en el aeropuerto · Atención en español · Sin cargos ocultos</p>

    <div class="sellos">
      <b>MIA</b>
      <b>FLL</b>
      <b>Reservá por WhatsApp</b>
    </div>
  </body>
</html>
